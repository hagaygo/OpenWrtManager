pluginManagement {
    def flutterSdkPath = settings.ext.has("flutter.sdk") ? settings.ext.get("flutter.sdk") : null
    if (flutterSdkPath == null) {
        def properties = new Properties()
        def localPropertiesFile = new File("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }
        flutterSdkPath = properties.getProperty("flutter.sdk")
    }
    
    assert flutterSdkPath != null, "flutter.sdk not set in local.properties"

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.0.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
}

include ":app"